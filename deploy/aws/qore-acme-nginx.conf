# Temporary port-80-only ingress for the first IP certificate issuance.
# Replace with qore-ip-nginx.conf.template after obtaining the certificate.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qore-acme;
        default_type text/plain;
    }

    location / { return 404; }
}
