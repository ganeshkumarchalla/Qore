<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="t d">
<title id="t">Animated QORE architecture</title><desc id="d">Gradient architecture flow from editor through compiler, simulator, proof, and evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".48" stop-color="#1b2940"/><stop offset="1" stop-color="#382d55"/></linearGradient><linearGradient id="node" x2="1"><stop stop-color="#223750"/><stop offset="1" stop-color="#31304f"/></linearGradient><linearGradient id="line"><stop stop-color="#6ea8d8"/><stop offset=".5" stop-color="#c5a9ff"/><stop offset="1" stop-color="#70b89a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.node{fill:url(#node);stroke:#6ea8d8;stroke-width:1.5}.title{font:700 17px Arial;fill:#f3f6fa}.sub{font:600 11px Arial;fill:#bac7d7;letter-spacing:1px}.edge{stroke:url(#line);stroke-width:3;stroke-dasharray:10 12;animation:flow 2s linear infinite}.orb{fill:#e3c9ff;filter:url(#glow);animation:orb 2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes orb{50%{opacity:.35;transform:scale(.7)}}@media(prefers-reduced-motion:reduce){.edge,.orb{animation:none}}</style></defs>
<rect width="1400" height="430" rx="28" fill="url(#bg)"/><circle cx="1180" cy="85" r="120" fill="#8c72d8" opacity=".12"/><circle cx="180" cy="355" r="150" fill="#59b8d8" opacity=".1"/><text x="60" y="62" class="sub">QORE / VERIFIED DATA FLOW</text><text x="60" y="102" class="title" font-size="28">A circuit becomes evidence through five guarded boundaries</text>
<g transform="translate(60 170)"><rect class="node" width="220" height="126" rx="18"/><text x="24" y="48" class="title">Workspace</text><text x="24" y="76" class="sub">AUTHOR</text><text x="24" y="101" class="sub">React · Monaco</text></g>
<g transform="translate(330 170)"><rect class="node" width="220" height="126" rx="18"/><text x="24" y="48" class="title">Compiler</text><text x="24" y="76" class="sub">PARSE + TYPE</text><text x="24" y="101" class="sub">AST · QORE-IR</text></g>
<g transform="translate(600 170)"><rect class="node" width="220" height="126" rx="18"/><text x="24" y="48" class="title">Worker</text><text x="24" y="76" class="sub">ISOLATE + RUN</text><text x="24" y="101" class="sub">Aer · bounded jobs</text></g>
<g transform="translate(870 170)"><rect class="node" width="220" height="126" rx="18"/><text x="24" y="48" class="title">Proof</text><text x="24" y="76" class="sub">OPTIMIZE + CHECK</text><text x="24" y="101" class="sub">unitary equivalence</text></g>
<g transform="translate(1140 170)"><rect class="node" width="200" height="126" rx="18"/><text x="24" y="48" class="title">Evidence</text><text x="24" y="76" class="sub">IMMUTABLE</text><text x="24" y="101" class="sub">ledger snapshot</text></g>
<path class="edge" d="M280 233h50M550 233h50M820 233h50M1090 233h50" fill="none"/><circle class="orb" cx="304" cy="233" r="5"/><circle class="orb" cx="574" cy="233" r="5"/><circle class="orb" cx="844" cy="233" r="5"/><circle class="orb" cx="1114" cy="233" r="5"/>
</svg>
