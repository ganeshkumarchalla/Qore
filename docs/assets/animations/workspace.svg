<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="QORE workspace conceptual illustration"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111923"/><stop offset=".6" stop-color="#1b2b3c"/><stop offset="1" stop-color="#101821"/></linearGradient></defs><rect width="1200" height="450" rx="24" fill="url(#bg)"/><text x="38" y="41.1" font-size="15" fill="#86b7df" font-family="Segoe UI,Arial,sans-serif" font-weight="650">QORE  /  06 · PRIVATE WORKSPACE</text><text x="36" y="86.08" font-size="32" fill="#eef2f6" font-family="Segoe UI,Arial,sans-serif" font-weight="650">Save confidently. Recover deliberately.</text><text x="38" y="122.86" font-size="19" fill="#a9b5c3" font-family="Segoe UI,Arial,sans-serif" font-weight="450">Account-owned files persist across refresh. Deleted files have 48 hours in Trash.</text><polyline points="37.00,420.00 1163.00,420.00" fill="none" stroke="#364655" stroke-width="1" stroke-linecap="round"/><text x="38" y="438.4" font-size="10" fill="#a9b5c3" font-family="Segoe UI,Arial,sans-serif" font-weight="650">PRODUCT CONCEPT  ·  ILLUSTRATIVE VALUES</text><rect x="38" y="158" width="560" height="240" rx="16" fill="#1a2733" stroke="#364655" stroke-width="1"/><text x="64" y="194.1" font-size="15" fill="#a9b5c3" font-family="Segoe UI,Arial,sans-serif" font-weight="650">YOUR DATABASE WORKSPACE</text><text x="69" y="248.56" font-size="24" fill="#eef2f6" font-family="Consolas,monospace" font-weight="450">research /</text><text x="69" y="290.56" font-size="24" fill="#eef2f6" font-family="Consolas,monospace" font-weight="650">   circuit.py</text><text x="69" y="332.56" font-size="24" fill="#eef2f6" font-family="Consolas,monospace" font-weight="450">   experiment.qasm</text><rect x="351" y="223" width="69" height="30" rx="15" fill="#21343b" stroke="#405953" stroke-width="1"/><text x="365" y="241.1" font-size="15" fill="#8bceba" font-family="Segoe UI,Arial,sans-serif" font-weight="650">