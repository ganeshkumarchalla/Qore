<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">QORE animated product tour</title><desc id="d">Seven animated cards describe the QORE quantum development workflow.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d131b"/><stop offset="1" stop-color="#202a36"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#6ea8d8"/><stop offset="1" stop-color="#9aaed0"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.card{fill:#151e28;stroke:#344252}.scan{animation:scan 5s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.spin{animation:spin 10s linear infinite;transform-origin:200px 184px}.flow{animation:flow 2.6s ease-in-out infinite}.marq{animation:marq 24s linear infinite}.n{font:600 14px Arial;fill:#eef2f6}.k{font:11px Arial;letter-spacing:2px;fill:#9aaed0}.s{font:12px Arial;fill:#a9b5c3}@keyframes scan{50%{transform:translateX(180px);opacity:.8}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{50%{stroke-dashoffset:-22}}@keyframes marq{to{transform:translateX(-630px)}}@media(prefers-reduced-motion:reduce){.scan,.float,.spin,.flow,.marq{animation:none}}
</style></defs><rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="70" y="74" class="k">QORE / PRODUCT TOUR</text><text x="70" y="116" class="n" font-size="30">From first gate to defensible evidence</text>
<g transform="translate(70 155)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">01 / AUTHOR</text><text x="26" y="74" class="n">Write a circuit, not a notebook.</text><g stroke="#344252"><path d="M28 124h310M28 158h310M28 192h310"/></g><circle cx="104" cy="124" r="16" fill="#202a36" stroke="url(#a)" stroke-width="3"/><text x="98" y="129" class="n">H</text><circle cx="216" cy="158" r="16" fill="#202a36" stroke="url(#a)" stroke-width="3"/><text x="211" y="163" class="n">X</text><path d="M104 124v34h112" fill="none" stroke="#6ea8d8" stroke-width="3" class="flow" stroke-dasharray="8 8"/></g>
<g transform="translate(515 155)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">02 / COMPILE</text><text x="26" y="74" class="n">Turn intent into typed QORE-IR.</text><rect x="28" y="104" width="314" height="82" rx="10" fill="#111821" stroke="#344252"/><text x="48" y="136" class="s">AST  →  IR  →  validated</text><text x="48" y="165" class="s">bounded source · no arbitrary execution</text><rect x="28" y="198" width="104" height="3" fill="#6ea8d8" class="scan"/></g>
<g transform="translate(960 155)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">03 / SIMULATE</text><text x="26" y="74" class="n">Observe probability in motion.</text><g class="float"><circle cx="188" cy="142" r="40" fill="url(#a)" filter="url(#gl)"/><circle cx="188" cy="142" r="74" fill="none" stroke="#6ea8d8" opacity=".5"/><circle cx="188" cy="142" r="104" fill="none" stroke="#9aaed0" opacity=".35"/></g><text x="28" y="201" class="s">shots · noise · statevector · counts</text></g>
<g transform="translate(70 420)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">04 / INSPECT</text><text x="26" y="74" class="n">See the state from every angle.</text><g class="spin" fill="none" stroke="#6ea8d8"><ellipse cx="200" cy="134" rx="92" ry="32"/><ellipse cx="200" cy="134" rx="92" ry="32" transform="rotate(60 200 134)"/><ellipse cx="200" cy="134" rx="92" ry="32" transform="rotate(120 200 134)"/></g><circle cx="200" cy="134" r="22" fill="url(#a)"/><text x="26" y="201" class="s">Bloch · amplitudes · unitary · QASM</text></g>
<g transform="translate(515 420)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">05 / OPTIMIZE</text><text x="26" y="74" class="n">Reduce the circuit without losing meaning.</text><g stroke="#6ea8d8" stroke-width="3" class="flow" stroke-dasharray="10 8"><path d="M38 130h100l30-30"/><path d="M38 168h190l30-38"/></g><text x="270" y="132" class="n">−66%</text><text x="270" y="169" class="s">gate depth</text></g>
<g transform="translate(960 420)"><rect class="card" width="370" height="220" rx="18"/><text x="26" y="38" class="k">06 / PROVE</text><text x="26" y="74" class="n">Demand operator-level equivalence.</text><circle cx="100" cy="145" r="34" fill="none" stroke="#70b89a" stroke-width="4"/><path d="m82 145 12 12 26-29" fill="none" stroke="#70b89a" stroke-width="4"/><text x="158" y="144" class="n">validated</text><text x="158" y="170" class="s">global phase · measurement map</text></g>
<text x="70" y="710" class="k">07 / ARCHIVE</text><text x="220" y="710" class="s">Immutable experiments preserve the source, configuration, result, and proof.</text>
</svg>
