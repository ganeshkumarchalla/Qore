<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">QORE workspace</title><desc id="desc">Animated quantum circuit editor and state visualization.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6ea8d8"/><stop offset="1" stop-color="#9aaed0"/></linearGradient><style>.p{animation:p 3s ease-in-out infinite;transform-origin:930px 220px}.o{animation:o 8s linear infinite;transform-origin:930px 220px}.s{animation:s 4s ease-in-out infinite}@keyframes p{50%{opacity:1;transform:scale(1.12)}}@keyframes o{to{transform:rotate(360deg)}}@keyframes s{50%{transform:translateY(170px);opacity:.45}}@media(prefers-reduced-motion:reduce){.p,.o,.s{animation:none}}</style></defs>
<rect width="1200" height="420" rx="24" fill="#111821"/><rect x="24" y="24" width="1152" height="372" rx="16" fill="#151e28" stroke="#344252"/><rect x="24" y="24" width="58" height="372" rx="16" fill="#0d131b"/><circle cx="53" cy="55" r="9" fill="#6ea8d8" class="p"/>
<rect x="102" y="46" width="1044" height="38" rx="8" fill="#19232e" stroke="#273340"/><text x="128" y="71" fill="#eef2f6" font-family="Arial" font-size="16" font-weight="700">QORE</text><text x="210" y="71" fill="#a9b5c3" font-family="Arial" font-size="12">Untitled quantum workspace</text>
<rect x="102" y="106" width="600" height="252" rx="12" fill="#19232e" stroke="#344252"/><text x="128" y="138" fill="#9aaed0" font-family="Arial" font-size="11" letter-spacing="2">CIRCUIT EDITOR</text><g stroke="#344252" stroke-width="2"><path d="M140 190h520M140 245h520M140 300h520"/></g><g stroke="url(#g)" stroke-width="3" fill="#202a36"><circle cx="260" cy="190" r="16"/><circle cx="400" cy="190" r="16"/><circle cx="520" cy="245" r="16"/></g><g fill="#eef2f6" font-family="Arial" font-size="13" text-anchor="middle"><text x="260" y="195">H</text><text x="400" y="195">X</text><text x="520" y="250">⊕</text></g><path d="M400 190v55h120" stroke="#6ea8d8" stroke-width="3" fill="none"/>
<rect x="726" y="106" width="420" height="252" rx="12" fill="#19232e" stroke="#344252"/><text x="752" y="138" fill="#9aaed0" font-family="Arial" font-size="11" letter-spacing="2">STATE WORLD</text><g class="o" fill="none" stroke="#6ea8d8" opacity=".7"><ellipse cx="930" cy="220" rx="116" ry="42"/><ellipse cx="930" cy="220" rx="116" ry="42" transform="rotate(60 930 220)"/><ellipse cx="930" cy="220" rx="116" ry="42" transform="rotate(120 930 220)"/></g><circle cx="930" cy="220" r="25" fill="url(#g)" class="p"/><text x="752" y="316" fill="#eef2f6" font-family="Arial" font-size="14">Measured outcome</text><text x="752" y="340" fill="#eef2f6" font-family="Arial" font-size="20" font-weight="700">|00⟩  0.50</text><rect x="102" y="106" width="600" height="2" fill="#6ea8d8" class="s"/>
</svg>
