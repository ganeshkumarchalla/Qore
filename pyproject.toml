[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qore-local"
version = "0.1.0"
description = "Evidence-driven local quantum development environment"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "qiskit>=2,<3", "qiskit-aer>=0.17,<0.19", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
quantum-runtime = ["qiskit-ibm-runtime>=0.51,<0.52", "qiskit-addon-utils>=0.4,<0.5", "qiskit-addon-aqc-tensor>=0.3,<0.4", "qiskit-addon-cutting>=0.10,<0.11", "qiskit-addon-mpf>=0.3,<0.4", "qiskit-addon-obp>=0.3,<0.4", "qiskit-addon-sqd>=0.14,<0.15"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"
